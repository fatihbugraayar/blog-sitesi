{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Giriş Yap</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100">Giriş</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'register' %}">Hesabın yok mu? Kayıt Ol</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
