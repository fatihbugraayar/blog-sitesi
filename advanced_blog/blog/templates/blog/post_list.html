{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row row-cols-1 row-cols-md-2 g-4">
    {% for post in posts %}
    <div class="col">
        <div class="card post-card h-100 shadow">
            {% if post.image %}
            <img src="{{ post.image.url }}" class="card-img-top post-image" alt="{{ post.title }}">
            {% endif %}
            <div class="card-body">
                <h2 class="card-title">
                    <a href="{% url 'post_detail' post.slug %}" class="text-decoration-none text-dark">
                        {{ post.title }}
                    </a>
                </h2>
                <p class="card-text">{{ post.content|truncatechars:200 }}</p>
            </div>
            <div class="card-footer bg-white">
                <small class="text-muted">
                    Yazar: {{ post.author }} | {{ post.published_date|date:"d F Y" }}
                </small>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
